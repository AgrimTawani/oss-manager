name: Poll tracked repos

on:
  schedule:
    - cron: "7,22,37,52 * * * *" # every 15 minutes, away from peak queue times
  workflow_dispatch: {} # allows manual triggering from the Actions tab

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Call poll endpoint
        run: |
          curl --fail-with-body --show-error --location --max-time 240 \
            -X POST "https://oss-manager-black.vercel.app/api/poll" \
            -H "Authorization: Bearer ${{ secrets.POLL_SECRET }}"
